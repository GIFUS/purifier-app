[package]
name = "purifier-app"
version = "1.0.0"
description = "Windows cleaner"
authors = ["GIFUS"]
edition = "2021"

[lib]
name = "purifier_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
walkdir = "2.5"
rayon = "1.12"
glob = "0.3"

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
